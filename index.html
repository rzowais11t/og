<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>WEXEL | AI Automation &amp; Infrastructure</title>
  <meta name="description" content="WEXEL builds enterprise-grade AI automation infrastructure — from intelligent voice agents and business intelligence to autonomous growth systems. Operate at a new level of scale." />
  <meta name="keywords" content="AI automation, enterprise AI, voice AI agents, business intelligence, growth automation, AI infrastructure, autonomous AI, enterprise automation platform" />
  <meta name="author" content="WEXEL" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Canonical (overridden per-page by SEOHead) -->
  <link rel="canonical" href="https://wexel.ai/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WEXEL" />
  <meta property="og:title" content="WEXEL | AI Automation &amp; Infrastructure" />
  <meta property="og:description" content="Enterprise-grade AI automation infrastructure. Voice agents, business intelligence, and autonomous growth systems built to scale." />
  <meta property="og:url" content="https://wexel.ai/" />
  <meta property="og:image" content="https://wexel.ai/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@wexel_ai" />
  <meta name="twitter:title" content="WEXEL | AI Automation &amp; Infrastructure" />
  <meta name="twitter:description" content="Enterprise-grade AI automation infrastructure. Voice agents, business intelligence, and autonomous growth systems built to scale." />
  <meta name="twitter:image" content="https://wexel.ai/og-image.jpg" />

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- AI crawler content index -->
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="/llms.txt" />

  <!-- DNS-Prefetch for Cal.com Embed (non-blocking) -->
  <link rel="dns-prefetch" href="https://app.cal.com" />

  <!-- Fonts: Non-blocking asynchronous loading with font-display: swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </noscript>

  <!-- JSON-LD Structured Data — Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "WEXEL",
    "url": "https://wexel.ai",

    "sameAs": [],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "owais@wexel.ai",
      "contactType": "customer support"
    }
  }
  </script>

  <!-- JSON-LD Structured Data — WebSite (enables sitelinks search box) -->

  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "WEXEL",
    "url": "https://wexel.ai"
  }
  </script>
</head>
